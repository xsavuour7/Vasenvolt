name: CICD
run-name: Complete CICD
on: [push]
jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend/
        run: npm ci

      - name: ESLint
        working-directory: frontend/
        run: npm run lint

      - name: Prettier · format
        working-directory: frontend/
        run: npm run format

  lint-backend:
    name: Lint-Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          pip install -r backend/requirements.txt

      - name: Black · format check
        run: black backend/

      - name: isort · import order check
        run: isort  --diff backend/

      - name: Flake8 · hard errors (syntax / undefined names)
        run: |
          flake8 backend/ --exclude=backend/venv \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Flake8 · style warnings
        run: |
          flake8 backend/ \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics \

  Test-Frontend:
    name: Test-Frontend
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run vitest tests with coverage
        working-directory: frontend
        run: npm test -- run --coverage

      - name: Build application
        working-directory: frontend
        run: npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontend
          fail_ci_if_error: false

  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    needs: lint-backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vasenvolt_test
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: vasenvolt_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
    
      - name: Create .env.test
        run: |
          cat > backend/.env.test << EOF
          ENVIRONMENT=test
          DATABASE_URL=postgresql://vasenvolt_test:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/vasenvolt_test
          REDIS_URL=redis://localhost:6379/0
          ENVIRONMENT=test
          DEBUG=false
          DATABASE_TEST_URL=postgresql://vasenvolt_test:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/vasenvolt_test
          SECRET_KEY=gl0de!VyR/1%ZoOf,lexD1bw|F5wc\*g|dxIN6>5{\z!:1k83LdB\B:K\Xi~=
          FRONTEND_URL=https://localhost:5173
          ALLOWED_ORIGINS=["http://localhost:5173"]
          EOF

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: python migrate.py upgrade head

      - name: Run tests with coverage
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: |
          pytest \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

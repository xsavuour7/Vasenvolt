name: CI/CD
run-name: "CI/CD · ${{ github.ref_name }} · ${{ github.event_name }}"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Deploy the backend to staging after CI passes
        required: true
        type: boolean
        default: true
      deploy_frontend:
        description: Deploy the frontend to staging after CI passes
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'staging-deployment' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install black flake8 isort
          python -m pip install --requirement backend/requirements.txt

      - name: Check formatting
        run: black --check backend/

      - name: Check import order
        run: isort --check-only --diff backend/

      - name: Check Python syntax and undefined names
        run: |
          flake8 backend/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=backend/venv,backend/__pycache__

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check Prettier formatting
        working-directory: frontend
        run: npm exec prettier -- --check .

  test-backend:
    name: Test backend
    needs: lint-backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vasenvolt_test
          POSTGRES_PASSWORD: vasenvolt_test
          POSTGRES_DB: vasenvolt_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement backend/requirements.txt

      - name: Configure the test environment
        working-directory: backend
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL=postgresql://vasenvolt_test:vasenvolt_test@localhost:5432/vasenvolt_test
          DATABASE_TEST_URL=postgresql://vasenvolt_test:vasenvolt_test@localhost:5432/vasenvolt_test
          SECRET_KEY=ci-test-secret-key-that-is-at-least-thirty-two-characters
          REDIS_URL=redis://localhost:6379/0
          FRONTEND_URL=http://localhost:5173
          ALLOWED_ORIGINS=["http://localhost:5173"]
          ENVIRONMENT=test
          DEBUG=false
          EOF

      - name: Run database migrations
        working-directory: backend
        env:
          APP_ENV: test
        run: python migrate.py migrate

      - name: Run tests with coverage
        working-directory: backend
        env:
          APP_ENV: test
        run: |
          pytest \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --verbose

      - name: Upload backend coverage
        if: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  test-frontend:
    name: Test frontend
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: frontend
        run: npm test -- run --coverage

      - name: Build application
        working-directory: frontend
        run: npm run build

      - name: Upload frontend coverage
        if: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontend
          fail_ci_if_error: false

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --requirement backend/requirements.txt --ignore-vuln PYSEC-2026-1325

  deploy-backend-staging:
    name: Deploy backend to staging
    needs: [test-backend, test-frontend, security-audit]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_backend }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          STAGING_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: vasenvolt-deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: STAGING_DATABASE_URL,STAGING_REDIS_URL,STAGING_SECRET_KEY
          script: |
            set -euo pipefail
            cd /opt/Vasenvolt/backend

            : "${STAGING_DATABASE_URL:?STAGING_DATABASE_URL is required}"
            : "${STAGING_REDIS_URL:?STAGING_REDIS_URL is required}"
            : "${STAGING_SECRET_KEY:?STAGING_SECRET_KEY is required}"

            git fetch --prune origin
            git reset --hard "origin/${{ github.ref_name }}"
            source venv/bin/activate
            pip install --requirement requirements.txt --quiet

            umask 077
            cat > .env.staging.tmp <<EOF
            DATABASE_URL=${STAGING_DATABASE_URL}
            DATABASE_TEST_URL=${STAGING_DATABASE_URL}
            SECRET_KEY=${STAGING_SECRET_KEY}
            REDIS_URL=${STAGING_REDIS_URL}
            FRONTEND_URL=https://staging.vasenvoltai.com
            ALLOWED_ORIGINS=["https://staging.vasenvoltai.com","https://www.staging.vasenvoltai.com"]
            ENVIRONMENT=staging
            DEBUG=false
            EOF
            mv .env.staging.tmp .env.staging

            APP_ENV=staging python migrate.py migrate
            if ! sudo systemctl show --property=Environment --value vasenvolt-backend | tr ' ' '\n' | grep --quiet --fixed-strings 'APP_ENV=staging'; then
              echo "vasenvolt-backend must set APP_ENV=staging in its systemd configuration"
              exit 1
            fi
            sudo systemctl restart vasenvolt-backend
            sleep 3
            sudo systemctl is-active --quiet vasenvolt-backend
            curl --fail --silent --show-error http://localhost:8000/health

      - name: Verify public backend health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://staging.vasenvoltai.com/health

  deploy-frontend-staging:
    name: Deploy frontend to staging
    needs: [test-backend, test-frontend, security-audit]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_frontend }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build staging bundle
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://staging.vasenvoltai.com/api
          NODE_ENV: production
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          alias-domains: |
            staging.vasenvoltai.com
            www.staging.vasenvoltai.com

  notify-deployment:
    name: Report deployment status
    needs: [deploy-backend-staging, deploy-frontend-staging]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        env:
          BACKEND_RESULT: ${{ needs.deploy-backend-staging.result }}
          FRONTEND_RESULT: ${{ needs.deploy-frontend-staging.result }}
        run: |
          echo "Backend: ${BACKEND_RESULT}"
          echo "Frontend: ${FRONTEND_RESULT}"
          if [[ "${BACKEND_RESULT}" == "failure" || "${FRONTEND_RESULT}" == "failure" ]]; then
            exit 1
          fi

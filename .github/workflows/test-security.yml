security-audit:
  name: Security Audit
  runs-on: ubuntu-latest
  on: [push]
 
jobs:   # Run in parallel with tests — doesn't depend on lint
  steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: "18"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
 
    - name: npm audit (high severity)
      working-directory: frontend
      run: npm audit --audit-level=high
 
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
 
    - name: pip-audit · Python dependencies
      run: |
        pip install pip-audit
        pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2022-42969
 
    - name: Snyk · advanced scan
      uses: snyk/actions/node@master
      continue-on-error: true          # report but don't hard-block
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --all-projects

name: Security Audit
run-name: Security-Audit
on: [push]
 
jobs:
  test-security:   # Run in parallel with tests — doesn't depend on lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
 
      - name: npm audit (high severity)
        working-directory: frontend
        run: npm audit --audit-level=high
 
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
 
      - name: pip-audit · Python dependencies
        run: |
          pip install pip-audit
          # ecdsa 0.19.2 is the latest available release; PYSEC-2026-1325
          # currently has no fixed version. Keep every remediable finding fatal.
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325
 
      - name: Snyk · advanced scan
        uses: snyk/actions/node@master
        continue-on-error: true          # report but don't hard-block
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

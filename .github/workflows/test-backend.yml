name: Test Backend
run-name: Test Backend
on: [push]

jobs:
  test-backend:
    name: Test · Backend
    needs: lint-backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vasenvolt_test
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: vasenvolt_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
 
    steps:
      - uses: actions/checkout@v6
 
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest --cov --cov-branch --cov-report=xml
          pip install -r backend/requirements.txt
 
      - name: Create .env.test
        run: |
          cat > backend/.env.test << EOF
          DATABASE_URL=postgresql://vasenvolt_test:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/vasenvolt_test
          REDIS_URL=redis://localhost:6379/0
          ENVIRONMENT=test
          DEBUG=false
          EOF
 
      - name: Run migrations
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: python migrate.py upgrade head
 
      - name: Run tests with coverage
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: |
          pytest \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v
 
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

name: Test Backend
run-name: Testing Backend
on: [push]

jobs:
  test-backend:
    name: Test · Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vasenvolt_test
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: vasenvolt_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
 
    steps:
      - uses: actions/checkout@v6
 
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create .env.test
        run: |
          cat > backend/.env.test << EOF
          DATABASE_URL=postgresql://vasenvolt_test:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/vasenvolt_test
          REDIS_URL=redis://localhost:6379/0
          ENVIRONMENT=test
          DEBUG=false
          DATABASE_TEST_URL=postgresql://vasenvolt_test:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/vasenvolt_test
          SECRET_KEY=gl0de!VyR/1%ZoOf,lexD1bw|F5wc\*g|dxIN6>5{\z!:1k83LdB\B:K\Xi~=
          FRONTEND_URL=https://localhost:5173
          ALLOWED_ORIGINS=http://localhost:5173
          EOF
 
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
  
      - name: Run migrations
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: python migrate.py upgrade head
 
      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL=postgresql://vasenvolt_test:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/vasenvolt_test
          REDIS_URL=redis://localhost:6379/0
          ENVIRONMENT=test
          DEBUG=false
          DATABASE_TEST_URL=postgresql://vasenvolt_test:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/vasenvolt_test
          SECRET_KEY=gl0de!VyR/1%ZoOf,lexD1bw|F5wc\*g|dxIN6>5{\z!:1k83LdB\B:K\Xi~=
          FRONTEND_URL=https://localhost:5173
          ALLOWED_ORIGINS=http://localhost:5173
        run: |
          pytest \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v
 
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

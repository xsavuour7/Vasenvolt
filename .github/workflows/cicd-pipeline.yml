name: CI/CD Pipeline
run-name: "CI/CD · ${{ github.ref_name }} · ${{ github.event_name }}"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
      deploy_backend:
        description: "Deploy backend"
        required: false
        type: boolean
        default: true
      deploy_frontend:
        description: "Deploy frontend"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────
# LINT
# ─────────────────────────────────────────────
jobs:
  lint-backend:
    name: Lint · Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          pip install -r backend/requirements.txt

      - name: Black · format check
        run: black --check backend/

      - name: isort · import order check
        run: isort --check-only --diff backend/

      - name: Flake8 · hard errors (syntax / undefined names)
        run: |
          flake8 backend/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=backend/venv,backend/__pycache__

      - name: Flake8 · style warnings
        run: |
          flake8 backend/ \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics \
            --exclude=backend/venv,backend/__pycache__

  lint-frontend:
    name: Lint · Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier · format check
        working-directory: frontend
        run: npm run format:check

# ─────────────────────────────────────────────
# TEST
# ─────────────────────────────────────────────
  test-backend:
    name: Test · Backend
    needs: lint-backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vasenvolt_test
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: vasenvolt_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install -r backend/requirements.txt

      - name: Create .env.test
        run: |
          cat > backend/.env.test << EOF
          DATABASE_URL=postgresql://vasenvolt_test:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/vasenvolt_test
          REDIS_URL=redis://localhost:6379/0
          SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}
          ENVIRONMENT=test
          DEBUG=false
          EOF

      - name: Run migrations
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: python migrate.py upgrade head

      - name: Run tests with coverage
        working-directory: backend
        env:
          ENV_FILE: .env.test
        run: |
          pytest \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  test-frontend:
    name: Test · Frontend
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Jest tests with coverage
        working-directory: frontend
        run: npm test -- --coverage --watchAll=false

      - name: Build application
        working-directory: frontend
        run: npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontend
          fail_ci_if_error: false

# ─────────────────────────────────────────────
# SECURITY
# ─────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Run in parallel with tests — doesn't depend on lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (high severity)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit · Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2022-42969

      - name: Snyk · advanced scan
        uses: snyk/actions/node@master
        continue-on-error: true          # report but don't hard-block
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

# ─────────────────────────────────────────────
# DEPLOY · STAGING
# ─────────────────────────────────────────────
  deploy-backend-staging:
    name: Deploy · Backend → Staging
    needs: [test-backend, test-frontend, security-audit]
    runs-on: ubuntu-latest
    environment: staging
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'staging' &&
      github.event.inputs.deploy_backend == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Create staging environment file
        run: |
          cat > backend/.env.staging << EOF
          DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL=${{ secrets.STAGING_REDIS_URL }}
          SECRET_KEY=${{ secrets.STAGING_SECRET_KEY }}
          ENVIRONMENT=staging
          DEBUG=false
          ALLOWED_HOSTS=staging.vasenvoltai.com,www.staging.vasenvoltai.com
          EOF

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: vasenvolt-deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/Vasenvolt/backend

            echo "── Pulling latest code ──"
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            echo "── Installing dependencies ──"
            source venv/bin/activate
            pip install -r requirements.txt --quiet

            echo "── Copying env file ──"
            cp .env.staging .env

            echo "── Running database migrations ──"
            python migrate.py upgrade head

            echo "── Restarting service ──"
            sudo systemctl restart vasenvolt-backend
            sleep 3
            sudo systemctl is-active vasenvolt-backend

            echo "── Health check ──"
            curl -sf http://localhost:8000/health || (echo "Health check failed" && exit 1)

      - name: Verify staging deployment
        run: |
          sleep 10
          curl -sf https://staging.vasenvoltai.com/health \
            -H "X-Deploy-Token: ${{ secrets.STAGING_DEPLOY_TOKEN }}" \
            || echo "Warning: external health check failed — check firewall/DNS"

  deploy-frontend-staging:
    name: Deploy · Frontend → Staging
    needs: [test-backend, test-frontend, security-audit]
    runs-on: ubuntu-latest
    environment: staging
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'staging' &&
      github.event.inputs.deploy_frontend == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://staging.vasenvoltai.com/api
          NODE_ENV: production
        run: npm run build

      - name: Deploy to Vercel (staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          alias-domains: |
            staging.vasenvoltai.com
            www.staging.vasenvoltai.com

# ─────────────────────────────────────────────
# DEPLOY · PRODUCTION (placeholder)
# ─────────────────────────────────────────────
  deploy-production:
    name: Deploy · Production
    needs: [test-backend, test-frontend, security-audit]
    runs-on: ubuntu-latest
    environment: production        # requires manual approval in GitHub env settings
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'production' &&
      github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Production deployment placeholder
        run: |
          echo "Production deployment is not yet configured."
          echo "Implement deployment steps here once the production"
          echo "environment is provisioned and secrets are set."
          echo ""
          echo "Ref:    ${{ github.ref_name }}"
          echo "SHA:    ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          exit 0

# ─────────────────────────────────────────────
# NOTIFY
# ─────────────────────────────────────────────
  notify-deployment:
    name: Notify · Deployment Status
    needs:
      - deploy-backend-staging
      - deploy-frontend-staging
      - deploy-production
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'workflow_dispatch'

    steps:
      - name: Report status
        run: |
          BACKEND="${{ needs.deploy-backend-staging.result }}"
          FRONTEND="${{ needs.deploy-frontend-staging.result }}"
          PRODUCTION="${{ needs.deploy-production.result }}"

          echo "╔══════════════════════════════════╗"
          echo "║     Vasenvolt Deployment Report  ║"
          echo "╠══════════════════════════════════╣"
          echo "║ Environment : ${{ github.event.inputs.environment }}"
          echo "║ Branch      : ${{ github.ref_name }}"
          echo "║ Triggered by: ${{ github.actor }}"
          echo "║ Backend     : ${BACKEND:-skipped}"
          echo "║ Frontend    : ${FRONTEND:-skipped}"
          echo "║ Production  : ${PRODUCTION:-skipped}"
          echo "╚══════════════════════════════════╝"

          # Fail the notify job if any deploy job failed
          if [[ "$BACKEND" == "failure" || "$FRONTEND" == "failure" || "$PRODUCTION" == "failure" ]]; then
            echo "One or more deployment jobs failed."
            exit 1
          fi

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vasenvolt"
version = "0.1.0"
description = "SaaS platform that ingests and analyzes energy consumption data."
authors = [
    {name = "Hayden Opolot", email = "hayden123@vasenvoltai.com"},
]
license = {text = "MIT"} # SPDX license identifier
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
{"fastapi", "requests>=2.25.0"}, 
]

[project.urls]
"Homepage" = "https://vasenvoltai.com"
"Repository" = "https://github.com/xsavuour7/vasenvolt-Saas

# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
# Default value: %%(rev)s_%%(slug)s
# This one prepends with date/time
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Ensure Alembic can import your app
prepend_sys_path = .

# Timezone for migration file timestamps (optional)
# timezone =

# Maximum length of slug field
# truncate_slug_length = 40

# Whether to run env.py during "revision" command
# revision_environment = false

# Whether to allow .pyc/.pyo-only revisions
# sourceless = false

# Format for version numbers (IMPORTANT: no double % here!)
version_num_format = %%04d

# Separator for version locations
version_path_separator = os

# Encoding of output revision files
# output_encoding = utf-8

# Database URL (will be overridden by env.py)
# sqlalchemy.url = postgresql://postgres:password@localhost:5432/vasenvolt


[post_write_hooks]
# Example of formatting with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S

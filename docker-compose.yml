
services: 
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: vasenvolt_app
    volumes:
      - .:/vasenvolt:cached
    command: python -m uvicorn main:app --reload --host 0.0.0.0 --port 8000  
    ports:
      - "8000:8000"
  
  postgres:
    image: postgres:16
    container_name: vasenvolt_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mango2020~Museveni100
      POSTGRES_DB: vasenvolt
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vasenvolt_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vasenvolt_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/vasenvolt
      - /vasenvolt/node_modules
      - ./frontend/dist:/app/dist
    depends_on:
      - app 

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: vasenvolt_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:rw
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/log:/mosquitto/log:rw

volumes:
  redis_data:
  postgres_data:
  config:
  data:
  log:
  frontend_dist:

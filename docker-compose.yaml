
services: 
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: vasenvolt_app
    volumes:
      - .:/vasenvolt:cached
    command: sleep infinity  
    ports:
      - "8000:8000"
  
  postgres:
    image: postgres:16
    container_name: vasenvolt_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mango2020@Museveni100
      POSTGRES_DB: vasenvolt
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vasenvolt_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vasenvolt_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/vasenvolt
      - /vasenvolt/node_modules
    depends_on:
      - app 

volumes:
  redis_data:
  postgres_data:

